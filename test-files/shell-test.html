<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shell test</title>
<style>body{font:15px/1.4 "Segoe UI",Arial,sans-serif;margin:16px}iframe{width:1366px;height:500px;border:2px solid #111}pre{background:#f4f4f4;padding:10px}</style>
</head>
<body>
<!-- Test helper for the app shell (routing, drop zone, errors, GO!, ZIP, Esc). Uses a stand-in tool so no real tool is needed.
     Needs a browser started with --allow-file-access-from-files. Downloads are caught, not saved. -->
<h1>Shell test</h1>
<pre id="out">running…</pre>
<iframe id="f" src="../index.html"></iframe>
<script src="samples.js"></script>
<script>
const out = document.getElementById('out');
const results = [];
const check = (name, ok, info) => results.push((ok ? 'PASS ' : 'FAIL ') + name + (info ? '  — ' + info : ''));
const wait = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms = 8000) { const t = Date.now(); while (Date.now() - t < ms) { if (fn()) return true; await wait(50); } return false; }
function sampleFile(w, name) {
  const bin = atob(SAMPLES[name]), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new w.File([u8], name, { type: name.endsWith('.pdf') ? 'application/pdf' : name.endsWith('.png') ? 'image/png' : 'image/jpeg' });
}
function drop(w, names) {
  const dt = new w.DataTransfer();
  names.forEach(n => dt.items.add(sampleFile(w, n)));
  w.document.body.dispatchEvent(new w.DragEvent('drop', { dataTransfer: dt, bubbles: true, cancelable: true }));
}

document.getElementById('f').onload = async function () {
  const w = this.contentWindow, d = w.document, $ = s => d.querySelector(s);
  const App = w.eval('App'); // top-level const in app.js is not a window property
  const errors = [];
  w.addEventListener('error', e => errors.push(e.message));
  const origErr = w.console.error;
  w.console.error = (...a) => { errors.push(a.join(' ')); origErr.apply(w.console, a); };
  const downloads = [];
  w.HTMLAnchorElement.prototype.click = function () { downloads.push({ name: this.download, href: this.href }); };
  try {
    check('home loads no PDF library', typeof w.PDFLib === 'undefined' && typeof w.pdfjsLib === 'undefined');

    // Drop a PDF on the home page: only PDF tools stay visible.
    drop(w, ['sample-3.pdf']);
    const visible = [...d.querySelectorAll('#grid a.card')].filter(a => !a.hidden).map(a => a.dataset.id);
    check('home drop filters tools', !$('#filter').hidden && visible.length === 13 && !visible.includes('img2pdf'), visible.length + ' cards shown');

    // Stand-in tool registered under "merge" so no tools/ file is needed.
    App.register('merge', {
      libs: ['pdflib'], multiple: true, tip: 'test tip',
      async run(files, opts, progress) {
        const outFiles = [];
        for (let i = 0; i < files.length; i++) {
          const doc = await App.loadPdf(files[i].bytes);
          outFiles.push({ name: 'copy-' + files[i].name, data: await doc.save() });
          await progress(i + 1, files.length);
        }
        return { files: outFiles, zip: 'copies.zip' };
      },
    });
    w.location.hash = '#/merge';
    await until(() => d.querySelectorAll('.files li').length === 1);
    const row = $('.files li');
    check('dropped file carried into tool', !!row && /3 pages/.test(row.textContent), row && row.textContent.replace(/[↑↓×]/g, ' ').trim());
    check('pdf-lib loaded only when tool opened', typeof w.PDFLib !== 'undefined' && typeof w.pdfjsLib === 'undefined');

    drop(w, ['locked.pdf']);
    await until(() => /password/i.test($('.status').textContent));
    check('locked PDF gives clear error', /password-protected/.test($('.status').textContent), $('.status').textContent);
    drop(w, ['broken.pdf']);
    await until(() => /damaged/i.test($('.status').textContent));
    check('broken PDF gives clear error', /damaged/.test($('.status').textContent), $('.status').textContent);
    drop(w, ['photo-wide.jpg']);
    await until(() => /not a PDF/.test($('.status').textContent));
    check('wrong file type skipped', /not a PDF/.test($('.status').textContent), $('.status').textContent);
    check('bad files not added', d.querySelectorAll('.files li').length === 1);

    drop(w, ['sample-12.pdf']);
    await until(() => d.querySelectorAll('.files li').length === 2);
    $('.files li button[aria-label^="Move sample-12"]').click(); // move up
    check('reorder with ↑ button', /sample-12/.test($('.files li').textContent));
    check('GO! enabled with files', !$('.go').disabled);

    $('.go').click();
    await until(() => downloads.length > 0, 30000);
    check('GO! delivers a ZIP for 2 files', downloads.length === 1 && downloads[0].name === 'copies.zip', downloads[0] && downloads[0].name);
    check('DONE! burst and status', $('#burst').classList.contains('show') && /DONE/.test($('.status').textContent), $('.status').textContent);

    // Read the ZIP back and verify its structure and CRCs.
    const buf = new Uint8Array(await (await w.fetch(downloads[0].href)).arrayBuffer());
    const dv = new DataView(buf.buffer);
    const eocd = buf.length - 22;
    const count = dv.getUint16(eocd + 10, true);
    let p = 0, names = [], crcOk = true;
    for (let i = 0; i < count; i++) {
      if (dv.getUint32(p, true) !== 0x04034b50) { crcOk = false; break; }
      const crc = dv.getUint32(p + 14, true), len = dv.getUint32(p + 18, true), nlen = dv.getUint16(p + 26, true);
      names.push(new TextDecoder().decode(buf.subarray(p + 30, p + 30 + nlen)));
      const data = buf.subarray(p + 30 + nlen, p + 30 + nlen + len);
      if (App.crc32(data) !== crc) crcOk = false;
      const head = new TextDecoder().decode(data.subarray(0, 5));
      if (head !== '%PDF-') crcOk = false;
      p += 30 + nlen + len;
    }
    check('ZIP valid (headers, CRC, PDFs inside)', dv.getUint32(eocd, true) === 0x06054b50 && count === 2 && crcOk, names.join(', '));

    // Esc goes home and frees the tool.
    d.body.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    await until(() => !$('#home').hidden);
    check('Esc returns home', !$('#home').hidden && $('#tool').children.length === 0);
    check('speed lines only on tool page', $('#speed').hasAttribute('hidden'));

    check('no console errors', errors.length === 0, errors.join(' | '));
  } catch (e) {
    check('test crashed', false, e.message);
  }
  out.textContent = results.join('\n');
};
</script>
</body>
</html>
